spring.application.name=barberia-elegance-api
server.port=8080

# ===================== BASE DE DATOS (MySQL) =====================
# Por defecto apunta a un MySQL local (XAMPP: usuario root sin clave).
# Se puede sobrescribir con variables de entorno DB_URL, DB_USER, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barberia_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================== SEGURIDAD JWT =====================
# Clave en Base64 (minimo 256 bits). En produccion definir JWT_SECRET.
app.jwt.secret=${JWT_SECRET:QmFyYmVyaWFFbGVnYW5jZS1EU1kxMTA0LUNsYXZlU2VjcmV0YS1KV1QtMjAyNi1EdW9jVUM=}
# Access token: 30 minutos | Refresh token: 7 dias (en milisegundos)
app.jwt.access-expiration-ms=1800000
app.jwt.refresh-expiration-ms=604800000

# Origenes permitidos para CORS (frontend Vite)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===================== SWAGGER / OPENAPI =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
